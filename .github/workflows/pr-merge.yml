# Merges a PR once it is ready. .github/scripts/pr-merge.sh makes the whole decision
# (integrate:ready, green version-check jobs, green review/agent when one exists, no merge:sol,
# not a draft, not a fork) and squash-merges pinned to the head it read. This file only wakes it
# when one of those inputs may have changed. release.yml then publishes on the push to main.
#
# Runs on the repo's own runner. It checks out main, never the PR, so no PR code executes here,
# and the script refuses a fork PR anyway.
#
# Token: GITHUB_TOKEN merges, but a merge made with it does not trigger other workflows, and
# release.yml is triggered by the push to main. Set the repo secret MERGE_TOKEN (a PAT with
# contents + pull-requests write on this repo; issues write if PRs close issues elsewhere) so
# the merge pushes as a user and release.yml fires. Without it the workflow still merges, but a
# release needs a manual `gh workflow run release` afterwards, and `Closes owner/repo#N` for
# another repo is not acted on.
name: pr-merge

on:
  workflow_run:
    workflows: [version-check]
    types: [completed]
  status:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: read
  actions: read
  checks: read

concurrency:
  group: pr-merge-${{ github.event.workflow_run.head_sha || github.event.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'status' && github.event.context == 'review/agent' && github.event.state == 'success') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'integrate:ready' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, bridge]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: pr-merge every open PR on this head
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          STATUS_SHA: ${{ github.event.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Not -e: a stopped result exits 2 and is read from $? below.
          set +e
          set -u
          command -v gh >/dev/null && command -v jq >/dev/null || { echo "::error::gh and jq must be installed on the runner"; exit 1; }
          case "$EVENT" in
            workflow_run) sha="$RUN_SHA" ;;
            status)       sha="$STATUS_SHA" ;;
            *)            sha="$PR_SHA" ;;
          esac
          prs="$(gh pr list --state open --base main --json number,headRefOid \
                   --jq ".[] | select(.headRefOid == \"$sha\") | .number")"
          [ -n "$prs" ] || { echo "no open PR into main has head $sha"; exit 0; }
          rc=0
          for pr in $prs; do
            echo "== PR #$pr"
            out="$(.github/scripts/pr-merge.sh "$pr")"; code=$?
            echo "$out"
            case "$code:$out" in
              0:merged*)
                # A cross-repo `Closes owner/repo#N` is not honoured for this merge: close it once.
                gh pr view "$pr" --json body --jq .body \
                  | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +[A-Za-z0-9._-]+/[A-Za-z0-9._-]+#[0-9]+' \
                  | sed -E 's/^[^ ]+ +//' | sort -u | while IFS='#' read -r repo n; do
                    [ "$repo" = "$GH_REPO" ] && continue
                    if [ "$(gh issue view "$n" -R "$repo" --json state --jq .state 2>/dev/null)" = OPEN ]; then
                      gh issue close "$n" -R "$repo" --reason completed \
                        --comment "Closed by the merge of $GH_REPO#$pr." || echo "::error::could not close $repo#$n"
                    fi
                  done ;;
              2:"stopped merge-refused"*)
                gh pr comment "$pr" --body "pr-merge: ${out#stopped merge-refused }" || true ;;
              2:*) ;;
              *) rc=1 ;;
            esac
          done
          exit "$rc"
